flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher_icon.png"

flutter:
  uses-material-design: true




  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/files/
    - assets/audios/
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  fonts:
    - family: Practical Grotesk
      fonts:
        - asset: fonts/practical_grotesk/regular.otf
        - asset: fonts/practical_grotesk/light.otf
          weight: 300
        - asset: fonts/practical_grotesk/extra_bold.otf
          weight: 800
        - asset: fonts/practical_grotesk/bold.otf
          weight: 600
        - asset: fonts/practical_grotesk/medium.otf
          weight: 500

  