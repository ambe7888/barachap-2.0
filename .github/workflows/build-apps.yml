name: Build BaraChap Apps (Client & Pro)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'client/**'
      - 'pro/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Sélectionner les applications à compiler'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'client'
          - 'pro'

jobs:
  build-client:
    name: Build BaraChap Client APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_app == 'all' || inputs.target_app == 'client' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies (Client)
        run: |
          cd client
          flutter pub get

      - name: Build Android Release APK (Client)
        run: |
          cd client
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barachap-client-release
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-pro:
    name: Build BaraChap Pro APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_app == 'all' || inputs.target_app == 'pro' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies (Pro)
        run: |
          cd pro
          flutter pub get

      - name: Build Android Release APK (Pro)
        run: |
          cd pro
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Pro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barachap-pro-release
          path: pro/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
